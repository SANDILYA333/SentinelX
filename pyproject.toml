[project]
name = "sentinelx-workspace"
version = "0.1.0"
description = "SentinelX - IT/OT threat detection and deception platform"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
    "httpx>=0.27.0",
    "pytest>=8.0.0",
    "ruff>=0.4.0",
]

[tool.uv.workspace]
members = ["engine", "services/api"]

[tool.uv.sources]
sentinelx = { workspace = true }

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.pytest.ini_options]
testpaths = ["engine/tests", "services/api/tests"]
pythonpath = ["engine", "services/api"]
