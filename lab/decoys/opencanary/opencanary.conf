{
    "device.node_id": "db-prod-02",
    "ip.ignorelist": [ ],
    "logtype.ignorelist": [ ],
    "ftp.enabled": true,
    "ftp.port": 21,
    "ftp.banner": "FTP server ready",
    "http.enabled": true,
    "http.port": 80,
    "http.banner": "Apache/2.4.52 (Ubuntu)",
    "http.skin": "nasLogin",
    "mysql.enabled": true,
    "mysql.port": 3306,
    "mysql.banner": "5.7.35-0ubuntu0.18.04.1",
    "mysql.log_connection_made": true,
    "ssh.enabled": false,
    "logger": {
        "class": "PyLogger",
        "kwargs": {
            "formatters": {
                "plain": {
                    "format": "%(message)s"
                }
            },
            "handlers": {
                "console": {
                    "class": "logging.StreamHandler",
                    "stream": "ext://sys.stdout"
                },
                "file": {
                    "class": "logging.FileHandler",
                    "filename": "/var/log/opencanary/opencanary.log"
                }
            }
        }
    }
}

