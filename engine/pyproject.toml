[project]
name = "sentinelx"
version = "0.1.0"
description = "SentinelX core engine and data contracts"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "joblib>=1.6.0",
    "networkx>=3.7",
    "pydantic>=2.7.0",
    "pyyaml>=6.0",
    "scikit-learn>=1.9.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sentinelx"]
