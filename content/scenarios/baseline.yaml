    name: "Initial Access via Stolen Jump-Host Credentials"
    technique: "T1078.003"
    actor: "attacker"
    host: "jump-host"
    action: "ssh_jump_login"
    target: "10.10.1.10"
    pacing_delay: [2.0, 4.0]

  - id: step_2
    name: "IT Subnet Network Service Discovery"
    technique: "T1046"
    actor: "attacker"
    host: "jump-host"
