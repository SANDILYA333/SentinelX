id: "RULE-OT-001"
title: "Unauthorized Modbus Physical Process Control Manipulation"
severity_hint: "critical"
score: 0.95
confidence: 0.95
applies_to:
  - category: "ot_command"
technique_ids:
  - "T0855"
condition:
  all_of:
    - field: "ot.is_write"
      operator: "eq"
      value: true
    - field: "tags"
      operator: "contains"
      value: "unauthorized_ot_write"
    - field: "ot.register"
      operator: "neq"
      value: null
explanation_template: "Unauthorized Modbus physical write to register {ot_register} (value: {ot_value}) on PLC {host}"
metadata:
  category: "OT Process Impairment"
  description: "Detects unauthorized physical manipulation of critical PLC registers outside maintenance window or by unapproved actors."

