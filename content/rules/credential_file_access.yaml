id: "RULE-CRED-001"
title: "Access to Sensitive Credential File or Honeytoken Asset"
severity_hint: "critical"
score: 0.90
confidence: 0.90
applies_to:
  - category: "process"
  - category: "file"
technique_ids:
  - "T1552.001"
condition:
  any_of:
    - field: "cmdline"
      operator: "contains_any"
      value:
        - ".db_creds"
        - "/srv/share/backup/.db_creds"
    - field: "tags"
      operator: "contains"
      value: "honey_file"
explanation_template: "Sensitive credential file accessed on {host} by user {user}: {cmdline}"
metadata:
  category: "Credential Access"
  description: "Triggers when sensitive backup credentials or canary honey files are read."

