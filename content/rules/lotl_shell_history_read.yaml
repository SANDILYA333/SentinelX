id: "RULE-LOTL-001"
title: "Living-off-the-Land Shell History Enumeration"
severity_hint: "high"
score: 0.88
confidence: 0.90
applies_to:
  - category: "process"
  - category: "file"
technique_ids:
  - "T1552.001"
  - "T1059.004"
condition:
  any_of:
    - field: "cmdline"
      operator: "contains_any"
      value:
        - ".bash_history"
        - ".zsh_history"
    - field: "tags"
      operator: "contains"
      value: "shell_history_read"
    - field: "action"
      operator: "eq"
      value: "shell_history_read"
explanation_template: "Attacker inspected administrative shell history on {host} ({user}): {cmdline}"
metadata:
  category: "Credential Access & Discovery"
  detector: "deception"
  description: "Detects enumeration or reading of planted shell history files containing decoy administrative commands."

