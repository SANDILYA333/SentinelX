[project]
name = "sentinelx-api"
version = "0.1.0"
description = "SentinelX API service"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.110.0",
    "pydantic>=2.7.0",
    "sentinelx",
    "uvicorn[standard]>=0.28.0",
    "websockets>=12.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
